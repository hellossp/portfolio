<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#030303" stop-opacity="0" />
    </radialGradient>
    
    <!-- Classy Emerald S Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Accent Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sleek Dark Rounded Background -->
  <rect width="512" height="512" rx="128" fill="#0b0b0f" stroke="rgba(255, 255, 255, 0.04)" stroke-width="6" />
  
  <!-- Radial Glow Behind the S -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />
  
  <!-- Scaled & Centered Logo Elements -->
  <g transform="translate(256, 256) scale(1.65) translate(-256, -256)">
    <!-- Classy Stylized 'S' -->
    <path d="M 335 175 C 310 135, 202 135, 177 195 C 152 255, 360 257, 335 317 C 310 377, 202 377, 177 337" 
          stroke="url(#emeraldGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          fill="none" 
          filter="url(#glow)" />
          
    <!-- Glowing Accent Dot -->
    <circle cx="335" cy="337" r="18" fill="url(#dotGrad)" filter="url(#glow)" />
  </g>
</svg>